<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleido's AI Assistant</title>
    <style>
        /* Your existing styles */
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Kaleido's AI Assistant</h1>
        <form id="apiForm">
            <!-- Change the placeholder to say 'Hugging Face API Token' -->
            <input type="text" id="hfToken" placeholder="Enter your Hugging Face API Token" required>
            <input type="text" id="userInput" placeholder="Type your message here" required>
            <input type="submit" value="Send">
        </form>
        <div id="response"></div>
    </div>

    <script>
        document.getElementById('apiForm').onsubmit = async function(e) {
            e.preventDefault();

            const hfToken = document.getElementById('hfToken').value;
            const userInput = document.getElementById('userInput').value;

            const responseDiv = document.getElementById('response');
            responseDiv.innerText = 'Loading...';

            try {
                // Use Hugging Face's API URL to interact with the model
                const response = await fetch('https://api-inference.huggingface.co/models/meta-llama/Llama-2-13b-chat-hf', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${hfToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: userInput
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Display the model's response
                    responseDiv.innerText = data.generated_text || "No response from the model";
                } else {
                    responseDiv.innerText = 'Error: ' + data.error.message;
                }
            } catch (error) {
                responseDiv.innerText = 'Error: ' + error.message;
            }
        };
    </script>
</body>
</html>
